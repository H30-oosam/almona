<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>أكاديمية المنى للتمكين والتدريب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07142e;--bg2:#0f2757;--g:#d9a85b;--g2:#f3d08e;--m:#b8c4de;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;color:#fff;background:radial-gradient(ellipse at 70% 0,#16356f 0,var(--bg) 60%) fixed;line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;max-width:1100px;margin:auto}
.br{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--g2)}.br img{width:44px;height:44px;border-radius:10px}
nav{display:flex;gap:14px;font-size:14px;color:var(--m);flex-wrap:wrap}nav a:hover{color:var(--g2)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;padding:30px 0 50px}
.tag{display:inline-block;border:1px solid var(--g);color:var(--g2);border-radius:99px;padding:2px 14px;font-size:14px}
h1{font-size:clamp(28px,5vw,48px);line-height:1.4;margin:12px 0;font-weight:900;background:linear-gradient(90deg,#fff,var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);font-size:18px}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:11px 24px;border-radius:12px;margin:8px 0 0 8px;background:linear-gradient(135deg,var(--g2),var(--g));color:#0a1a3c;box-shadow:0 6px 0 #9a7330,0 14px 24px -8px #000;transition:.15s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a7330}
.btn.o{background:transparent;color:#fff;border:1.5px solid var(--g);box-shadow:0 6px 0 #0a1a3c}
.stage{perspective:1000px;display:grid;place-items:center;min-height:320px}
.float{animation:fl 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes fl{50%{transform:translateY(-14px) rotateY(10deg)}}
.logo3d{position:relative;transform-style:preserve-3d;transition:transform .12s}
.logo3d::before{content:"";position:absolute;inset:6% ;background:var(--g);filter:blur(50px);opacity:.35;transform:translateZ(-70px)}
.logo{width:min(80vw,340px);border-radius:26px;display:block;box-shadow:0 30px 60px -10px #000,0 0 40px rgba(217,168,91,.35);border:1px solid rgba(217,168,91,.4)}
.cube{position:absolute;width:56px;height:56px;transform-style:preserve-3d;animation:sp 14s linear infinite}
.cube.c1{top:-14px;right:-18px}.cube.c2{bottom:20px;left:-22px;width:38px;height:38px;animation-duration:9s;animation-direction:reverse}
.cube i{position:absolute;inset:0;border:2px solid var(--g);background:rgba(217,168,91,.14)}
.cube i:nth-child(1){transform:translateZ(28px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(28px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(28px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(28px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(28px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(28px)}
.c2 i{transform-origin:center}
@keyframes sp{from{transform:translateZ(90px) rotateX(0) rotateY(0)}to{transform:translateZ(90px) rotateX(360deg) rotateY(360deg)}}
section{padding:36px 0}
h2{font-size:30px;margin:0 0 20px;color:var(--g2);font-weight:900}h2::after{content:"";display:block;width:60px;height:4px;background:var(--g);border-radius:4px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;perspective:1000px}
.card{position:relative;background:linear-gradient(145deg,#142f66,#0a1a3c);border:1px solid rgba(217,168,91,.3);border-radius:18px;padding:20px;transform-style:preserve-3d;box-shadow:0 22px 30px -16px #000,inset 0 1px 0 rgba(255,255,255,.12);transition:transform .15s}
.card>*{transform:translateZ(26px)}
.ic{font-size:30px;display:block}
.about{color:var(--m);font-size:18px;white-space:pre-wrap}
.art img{width:100%;max-height:230px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.art .d{color:var(--m);font-size:13px}.art h3{margin:4px 0;color:var(--g2)}.art p{white-space:pre-wrap;margin:6px 0;color:#dfe6f5}
.ph{display:none;border:2px dashed var(--g);border-radius:12px;padding:20px;text-align:center;color:var(--g2);margin-bottom:10px;cursor:pointer}
form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
input,select,textarea{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid rgba(217,168,91,.4);background:#0a1a3c;color:#fff;width:100%}
.full{grid-column:1/-1}
footer{text-align:center;padding:36px 18px 120px;color:var(--m);border-top:1px solid rgba(217,168,91,.25);margin-top:30px}
.wa{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:30px;box-shadow:0 8px 0 #148a40,0 14px 20px -6px #000;z-index:20}
.lock{background:none;border:0;color:#5d6e96;cursor:pointer;font-size:18px}
.x,.add,.rm{display:none}
body.edit .x{display:block;position:absolute;top:8px;left:8px;z-index:3;background:#c0392b;color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
body.edit .add,body.edit .rm{display:inline-block;background:transparent;border:1.5px dashed var(--g);color:var(--g2);border-radius:12px;padding:8px 16px;font:inherit;cursor:pointer;margin-top:10px}
body.edit [data-k]{outline:1px dashed rgba(217,168,91,.7);border-radius:4px;cursor:text;min-height:1em}
body.edit [data-img]{cursor:pointer;outline:2px dashed var(--g)}body.edit .ph{display:block}
body.edit .wa{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bar{position:fixed;inset:auto 0 0 0;z-index:30;background:#050e22ee;border-top:1px solid var(--g);display:none;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.bar.on{display:flex}.bar button{font:inherit;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--g);background:#10285a;color:#fff;cursor:pointer}
.bar .p{background:var(--g);color:#0a1a3c;font-weight:700}
.mo{position:fixed;inset:0;background:#000a;z-index:40;display:none;place-items:center;padding:16px}.mo.on{display:grid}
.mb{background:#0d2250;border:1px solid var(--g);border-radius:18px;padding:20px;width:min(480px,100%);max-height:88vh;overflow:auto;display:grid;gap:8px}
.mb label{font-size:13px;color:var(--g2)}.mb h3{margin:0;color:var(--g2)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#0a1a3c;padding:8px 18px;border-radius:99px;z-index:60;font-weight:700;display:none}
@media(max-width:780px){.hero{grid-template-columns:1fr}.stage{order:-1;min-height:260px}.logo{width:min(70vw,260px)}}
@media(prefers-reduced-motion:reduce){.float,.cube{animation:none}}
</style></head><body>
<div id="app"></div><div id="toast"></div>

<div class="mo" id="mo"><div class="mb" id="mb"></div></div>

}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function pick(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const m=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82));URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};i.click()}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const modal=h=>{$('#mb').innerHTML=h;$('#mo').classList.add('on')},close=()=>$('#mo').classList.remove('on');
document.addEventListener('input',e=>{const k=e.target.dataset?.k;if(k&&edit)sp(k,e.target.innerText.replace(/\n$/,''))});
document.addEventListener('click',async e=>{
const t=e.target,a=t.closest('a');if(edit&&a&&!a.closest('#bar'))e.preventDefault();
const d=t.closest('[data-del]');if(d){S[d.dataset.del].splice(+d.dataset.i,1);mark();return render()}
const ad=t.closest('[data-add]');if(ad){const k=ad.dataset.add;k=='articles'?S.articles.unshift({t:'عنوان المقال',d:new Date().toLocaleDateString('ar-EG'),b:'اكتب نص المقال هنا…',img:''}):S[k].push(k=='services'?'خدمة جديدة':k=='features'?'ميزة جديدة':'فئة جديدة');mark();return render()}
const rm=t.closest('[data-rm]');if(rm){S.articles[+rm.dataset.rm].img='';mark();return render()}
const im=t.closest('[data-img]');if(im&&edit){const p=im.dataset.img;pick(u=>{sp(p,u);render()});return}
if(t.id==='lk'){return authed?(authed=edit=true,render()):modal('<h3>دخول الإدارة</h3><input id="pw" type="password" placeholder="كلمة المرور" autofocus><button class="btn" id="go">دخول</button><button class="btn o" id="cl">إغلاق</button>')}
if(t.id==='cl')return close();
if(t.id==='go'){if(await sha($('#pw').value)===S.ph){authed=edit=true;try{sessionStorage.setItem('adm','1')}catch(x){}close();render();toast('أهلاً بك ✨')}else toast('كلمة المرور غير صحيحة');return}
if(t.id==='b-edit'){edit=!edit;return render()}
if(t.id==='b-out'){authed=edit=false;try{sessionStorage.removeItem('adm')}catch(x){}return render()}
if(t.id==='b-pub')return publish();
if(t.id==='b-set')return modal(`<h3>الإعدادات</h3>${[['phone','الهاتف المعروض'],['wa','رقم واتساب (أرقام فقط مع رمز الدولة)'],['email','البريد'],['yt','رابط اليوتيوب'],['lt','رابط Linktree'],['fb','رابط فيسبوك']].map(([k,l])=>`<label>${l}</label><input data-s="${k}" value="${esc(S[k])}">`).join('')}<button class="btn o" id="lg">🖼️ تغيير الشعار</button><h3>تغيير كلمة المرور</h3><input id="p0" type="password" placeholder="الحالية"><input id="p1" type="password" placeholder="الجديدة (4 أحرف على الأقل)"><button class="btn o" id="pc">تغيير كلمة المرور</button><button class="btn" id="sv">تم</button>`);
if(t.id==='sv'){document.querySelectorAll('[data-s]').forEach(i=>{if(S[i.dataset.s]!==i.value){S[i.dataset.s]=i.value.trim();mark()}});close();return render()}
if(t.id==='lg')return pick(u=>{sp('logo',u);render()});
if(t.id==='pc'){if(await sha($('#p0').value)!==S.ph)return toast('الكلمة الحالية خاطئة');const n=$('#p1').value;if(n.length<4)return toast('كلمة المرور قصيرة');S.ph=await sha(n);mark();close();toast('تم التغيير، اضغط حفظ ونشر');return}
if(t.id==='mail'){const f=new FormData($('#f'));location.href=`mailto:${S.email}?subject=${encodeURIComponent('تسجيل: '+f.get('g'))}&body=${encodeURIComponent(msgOf(f))}`}
});
const msgOf=f=>`طلب تسجيل\nالاسم: ${f.get('n')}\nالهاتف: ${f.get('p')}\nالبريد: ${f.get('e')}\nالبلد: ${f.get('c')}\nالبرنامج: ${f.get('g')}`;
document.addEventListener('submit',e=>{e.preventDefault();if(edit)return;window.open(`https://wa.me/${S.wa}?text=${encodeURIComponent(msgOf(new FormData(e.target)))}`,'_blank')});
async function publish(){
const art=await claude.use('artifact');if(!art)return toast('النشر غير متاح في هذا العرض');
const json=JSON.stringify(S).replace(/</g,'\\u003c');
const html=TEMPLATE.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
try{toast('جارٍ النشر…');await art.publish(html)}catch(x){toast(x.code==='not_writer'||x.code==='not_granted'?'ليست لديك صلاحية النشر':'تعذر الحفظ')}}
document.addEventListener('pointermove',e=>{if(edit)return;const c=e.target.closest?.('.card,.stage');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,k=c.classList.contains('stage')?22:12,el=c.classList.contains('stage')?$('#l3'):c;el.style.transform=`perspective(800px) rotateY(${x*k}deg) rotateX(${-y*k}deg)`});
document.addEventListener('pointerout',e=>{const c=e.target.closest?.('.card,.stage');if(!c||c.contains(e.relatedTarget))return;(c.classList.contains('stage')?$('#l3'):c).style.transform=''});
render();
</script></body></html>
